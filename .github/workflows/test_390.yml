name: Python tests  390

on:
  push:
    branches:
      - testworkflow/issue-390
    paths:
      - 'boaviztapi/**'
      - 'tests/**'
      - 'poetry.lock'
      - 'pyproject.toml'
      - 'requirements.txt'
  pull_request:
    paths:
      - 'boaviztapi/**'
      - 'tests/**'
      - 'poetry.lock'
      - 'pyproject.toml'
      - 'requirements.txt'
    branches:
      - testworkflow/issue-390

jobs:
  test:
    strategy:
      matrix:
        version: ["3.10", "3.11", "3.12"]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.version }}


    - name: Install pipenv
      run: |
        python -m pip install --upgrade poetry wheel

    - name: Install dependencies
      run: |
        make install

    - name: Run test suite
      run: |
        make test
